version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: cuisine-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DATASOURCE_PASSWORD}
      MYSQL_DATABASE: cuisine
      MYSQL_USER: ${DATASOURCE_USER}
      MYSQL_PASSWORD: ${DATASOURCE_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    restart: always

  backend:
    build: .
    container_name: cuisine-backend
    depends_on:
      - db
    environment:
      DATASOURCE_URL: jdbc:mysql://db:3306/cuisine?useSSL=false&allowPublicKeyRetrieval=true
      DATASOURCE_USER: ${DATASOURCE_USER}
      DATASOURCE_PASSWORD: ${DATASOURCE_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
    restart: always

volumes:
  mysql_data: